abstract class GpuTestLockService implements org.gradle.api.services.BuildService<org.gradle.api.services.BuildServiceParameters.None> {}

def gpuTestLock = gradle.sharedServices.registerIfAbsent('gpuTestLock', GpuTestLockService) {
    maxParallelUsages.set(1)
}

subprojects {
    apply plugin: 'java'

    group = 'io.github.ch-abhinav'
    version = '0.1.0'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:all,-serial']
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addStringOption('Xdoclint:all,-missing', '-quiet')
    }

    tasks.withType(Test).configureEach {
        usesService(gpuTestLock)
    }
}
