subprojects {
    apply plugin: 'java'

    group = 'io.github.ch-abhinav'
    version = '0.1.0'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:all,-serial']
    }
}
