plugins {
    id 'java'
    id 'application'
    id 'me.champeau.jmh' version '0.7.3' 
}

group = 'hc4j'
version = '0.0.2'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}


application {
    mainClass = 'hc4j.test.Main' 
}

repositories {
    mavenCentral()
}


task buildRust(type: Exec) {
    description = 'Compiles the HC4J Rust WebGPU backend via Cargo.'
    group = 'build'
    workingDir = rootDir

    
    if (System.getProperty("os.name").toLowerCase().contains("windows")) {
        commandLine 'cmd', '/c', 'cargo build --manifest-path src/main/rust/Cargo.toml --release'
    } else {
        commandLine 'sh', '-c', 'cargo build --manifest-path src/main/rust/Cargo.toml --release'
    }
}

processResources.dependsOn buildRust
classes.dependsOn buildRust


tasks.withType(JavaExec).configureEach {
    
    jvmArgs += ['--enable-native-access=ALL-UNNAMED']
}

tasks.register('trignoSmokeTest', JavaExec) {
    description = 'End-to-end check of the trig FFM bindings and the tiered VRAM manager on the real GPU.'
    group = 'verification'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'hc4j.test.TrignoSmokeTest'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

tasks.register('engineSmokeTest', JavaExec) {
    description = 'End-to-end check of matmul, fusion, slabs, batching and >67M-element grid folding on the real GPU.'
    group = 'verification'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'hc4j.test.EngineSmokeTest'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    // The >67M-element checks hold two 269 MB float[] copies at once.
    maxHeapSize = '2g'
}

tasks.register('smokeTests') {
    description = 'Runs both GPU smoke suites (end-to-end verification).'
    group = 'verification'
    dependsOn 'trignoSmokeTest', 'engineSmokeTest'
}

// `check` (and therefore `build`) runs the smoke suites, which need a GPU.
// Drop this line to keep the GPU out of the default build.
tasks.named('check').configure { dependsOn 'smokeTests' }

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs += ['--enable-native-access=ALL-UNNAMED']
} 
jmh {
    // Pin the harness: the plugin otherwise tracks its own default (1.36), while the
    // dependency cache holds 1.37.
    jmhVersion = '1.37'

    jvmArgsAppend = ['--enable-native-access=ALL-UNNAMED']
    
    
    warmupIterations = 2
    iterations = 5
    fork = 1
    threads = 1
    
    
    resultFormat = 'JSON'
    resultsFile = project.file("$buildDir/reports/jmh/results.json")
}

tasks.named('jmh').configure {
    dependsOn buildRust
}