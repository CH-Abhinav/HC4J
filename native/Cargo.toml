[package]
name = "hc4j"
version = "0.1.0"
edition = "2024"
# Floor set by let-chains in edition 2024 (1.88) and `is_multiple_of` (1.87),
# both used throughout. Verified against 1.96.
rust-version = "1.88"
description = "GPU tensor engine behind HC4J: wgpu/WGSL compute kernels exposed over a C ABI for Java Panama FFM."
license = "Apache-2.0"
repository = "https://github.com/CH-Abhinav/HC4J"
publish = false

[lib]
name = "hc4j"
crate-type = ["cdylib"]

[features]
default = ["vulkan-p2p"]
vulkan-p2p = []

[dependencies]
pollster = "1.0.0"
bytemuck = "1.25.2"

# common wgpu config
[dependencies.wgpu]
version = "30.0.0"
default-features = false
features = ["wgsl"]

# windows specific config
[target.'cfg(target_os = "windows")'.dependencies.wgpu]
version = "30.0.0"
features = ["dx12", "vulkan", "wgsl"]

# linux specific config
[target.'cfg(target_os = "linux")'.dependencies.wgpu]
version = "30.0.0"
features = ["vulkan", "wgsl"]

# macos specific config
[target.'cfg(target_os = "macos")'.dependencies.wgpu]
version = "30.0.0"
features = ["metal", "wgsl"]

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
ash = "0.38"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
bytemuck = "1.25.2"
naga = { version = "30.0.0", features = ["wgsl-in", "spv-out"] }

# Shader validation in unit tests (naga is already in the dependency tree via wgpu).
[dev-dependencies]
naga = { version = "30.0.0", features = ["wgsl-in"] }
